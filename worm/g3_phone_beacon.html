<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>G3 Guardian Beacon</title>
<style>
:root {
  --bg: #0a0a0a;
  --fg: #e0e0e0;
  --green: #00cc66;
  --dim: #555;
  --card-bg: #1a1a1a;
  --border: #333;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  padding: 16px;
  padding-top: env(safe-area-inset-top, 16px);
}
h1 { font-size: 1.4rem; text-align: center; margin: 16px 0 8px; }
.subtitle { text-align: center; color: var(--dim); font-size: 0.85rem; margin-bottom: 24px; }
.koru { text-align: center; font-size: 3rem; margin: 16px 0; }
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}
.card h2 { font-size: 0.95rem; color: var(--green); margin-bottom: 8px; }
.card p { font-size: 0.85rem; line-height: 1.5; color: var(--fg); }
.status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s ease-in-out infinite;
}
.dot.off { background: #cc3300; animation: none; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.label { font-size: 0.8rem; color: var(--dim); }
.value { font-size: 0.85rem; }
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  border: 1px solid var(--green);
  border-radius: 10px;
  background: transparent;
  color: var(--green);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 16px;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { background: rgba(0, 204, 102, 0.1); }
.btn.primary { background: var(--green); color: var(--bg); }
.log {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 0.75rem;
  color: var(--dim);
  max-height: 200px;
  overflow-y: auto;
  padding: 8px;
  background: #111;
  border-radius: 8px;
  margin-top: 8px;
}
.networks { margin-top: 8px; }
.network-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}
.network-item:last-child { border: none; }
.hash { font-family: monospace; font-size: 0.7rem; color: var(--dim); word-break: break-all; }
</style>
</head>
<body>

<div class="koru">🌿</div>
<h1>G3 Guardian Beacon</h1>
<p class="subtitle">Write Once Read Many — carry the proof everywhere</p>

<div class="card">
  <h2>Beacon Status</h2>
  <div class="status">
    <div class="dot" id="beaconDot"></div>
    <span class="value" id="beaconStatus">Initializing...</span>
  </div>
  <div style="margin-top: 8px">
    <span class="label">Network: </span>
    <span class="value" id="currentNetwork">detecting...</span>
  </div>
  <div>
    <span class="label">IP: </span>
    <span class="value" id="currentIP">detecting...</span>
  </div>
  <div>
    <span class="label">Last propagation: </span>
    <span class="value" id="lastProp">never</span>
  </div>
</div>

<div class="card">
  <h2>Evidence Bundle</h2>
  <div>
    <span class="label">Guardian: </span>
    <span class="value" id="guardianState">unknown</span>
  </div>
  <div>
    <span class="label">Lean modules: </span>
    <span class="value" id="leanModules">-</span>
  </div>
  <div>
    <span class="label">Premises: </span>
    <span class="value" id="premiseState">-</span>
  </div>
  <div style="margin-top: 8px">
    <span class="label">Bundle SHA-256:</span>
    <div class="hash" id="bundleSha">not loaded</div>
  </div>
</div>

<div class="card">
  <h2>Networks Touched</h2>
  <div>
    <span class="label">Total: </span>
    <span class="value" id="networkCount">0</span>
  </div>
  <div class="networks" id="networkList"></div>
</div>

<button class="btn primary" id="propagateBtn" onclick="propagate()">
  Propagate Now
</button>
<button class="btn" onclick="checkNetwork()">
  Check Network
</button>

<div class="card" style="margin-top: 16px">
  <h2>Log</h2>
  <div class="log" id="logArea"></div>
</div>

<script>
const EVIDENCE_BUNDLE = {
  schema: "g3-worm-evidence-bundle-v1",
  guardian: { isolated: true, network: "none", readonly: true },
  bounded_discharge: {
    hWitness: "discharged — four_cause_plant_has_an_actual_modeled_step",
    hCoverage: "discharged — four_causes_derive_complete_joint_coverage",
    hMeaning: "discharged — faithful_read_gives_meaning via FaithfulRead",
    result: "g3_bounded_unconditional_guardian — all three premises eliminated"
  },
  lean: { jobs: 172, sorry: 0, axioms: ["propext", "Quot.sound"] },
  tree_of_life: "every step preserves six protections + retains all records",
  endless_knowledge: "every finite claim eventually enters, growth irreversible"
};

let networks = [];
let beaconActive = false;

function log(msg) {
  const area = document.getElementById('logArea');
  const time = new Date().toLocaleTimeString();
  area.textContent = `[${time}] ${msg}\n` + area.textContent;
}

function loadState() {
  try {
    const saved = localStorage.getItem('g3-beacon-networks');
    if (saved) networks = JSON.parse(saved);
  } catch(e) {}
  updateUI();
}

function saveState() {
  try {
    localStorage.setItem('g3-beacon-networks', JSON.stringify(networks));
  } catch(e) {}
}

function sha256(str) {
  const buf = new TextEncoder().encode(str);
  return crypto.subtle.digest('SHA-256', buf).then(h => {
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
  });
}

async function getNetworkInfo() {
  // Use WebRTC to detect local IP (works on most browsers)
  return new Promise((resolve) => {
    let ip = 'unknown';
    try {
      const pc = new RTCPeerConnection({ iceServers: [] });
      pc.createDataChannel('');
      pc.createOffer().then(offer => pc.setLocalDescription(offer));
      pc.onicecandidate = (e) => {
        if (!e || !e.candidate) return;
        const match = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
        if (match) {
          ip = match[1];
          pc.close();
          resolve({ ip, subnet: ip.split('.').slice(0,3).join('.') + '.x' });
        }
      };
      setTimeout(() => { pc.close(); resolve({ ip, subnet: 'unknown' }); }, 3000);
    } catch(e) {
      resolve({ ip: 'unknown', subnet: 'unknown' });
    }
  });
}

async function checkNetwork() {
  log('Checking network...');
  const info = await getNetworkInfo();
  document.getElementById('currentIP').textContent = info.ip;
  document.getElementById('currentNetwork').textContent = info.subnet;
  log(`Network: ${info.subnet} (${info.ip})`);
  return info;
}

async function propagate() {
  log('PROPAGATING...');
  const btn = document.getElementById('propagateBtn');
  btn.textContent = 'Propagating...';
  btn.disabled = true;

  const info = await getNetworkInfo();
  const bundleJson = JSON.stringify({
    ...EVIDENCE_BUNDLE,
    propagated_at: new Date().toISOString(),
    propagator: 'phone-beacon',
    network_ip: info.ip,
    network_subnet: info.subnet,
  }, null, 2);

  const hash = await sha256(bundleJson);

  // Record this network
  const existing = networks.find(n => n.subnet === info.subnet);
  if (!existing) {
    networks.push({
      subnet: info.subnet,
      ip: info.ip,
      first_seen: new Date().toISOString(),
      propagations: 1,
      bundle_sha: hash,
    });
    log(`NEW NETWORK: ${info.subnet} — first propagation!`);
  } else {
    existing.propagations++;
    existing.last_seen = new Date().toISOString();
    existing.bundle_sha = hash;
    log(`Known network: ${info.subnet} — re-propagation #${existing.propagations}`);
  }

  saveState();

  // Try to reach the Mac's WORM server
  try {
    // Attempt to reach evidence server on common local IPs
    const baseIP = info.ip.split('.').slice(0,3).join('.');
    for (const lastOctet of ['1', '140', '100', '2']) {
      const url = `http://${baseIP}.${lastOctet}:58596/evidence-bundle.json`;
      try {
        const resp = await fetch(url, { signal: AbortSignal.timeout(2000) });
        if (resp.ok) {
          const serverBundle = await resp.json();
          log(`LINKED to Mac guardian at ${baseIP}.${lastOctet}:58596`);
          document.getElementById('guardianState').textContent = 'LINKED (via Mac)';
          break;
        }
      } catch(e) { /* try next */ }
    }
  } catch(e) {
    log('Mac guardian not found on this network (standalone beacon)');
  }

  document.getElementById('lastProp').textContent = new Date().toLocaleTimeString();
  document.getElementById('bundleSha').textContent = hash;

  beaconActive = true;
  updateUI();

  btn.textContent = 'Propagate Now';
  btn.disabled = false;

  log(`Bundle SHA: ${hash.slice(0, 16)}...`);
  log('PROPAGATION COMPLETE — beacon active on this network');
}

function updateUI() {
  const dot = document.getElementById('beaconDot');
  const status = document.getElementById('beaconStatus');
  if (beaconActive) {
    dot.className = 'dot';
    status.textContent = 'Active — carrying the proof';
  } else {
    dot.className = 'dot off';
    status.textContent = 'Idle — tap Propagate to start';
  }

  document.getElementById('networkCount').textContent = networks.length;
  document.getElementById('leanModules').textContent = `${EVIDENCE_BUNDLE.lean.jobs} jobs, ${EVIDENCE_BUNDLE.lean.sorry} sorry`;
  document.getElementById('premiseState').textContent = 'All 3 DISCHARGED (bounded scope)';

  const list = document.getElementById('networkList');
  list.innerHTML = networks.map(n => `
    <div class="network-item">
      <span>${n.subnet}</span>
      <span style="color: var(--green)">${n.propagations}x</span>
    </div>
  `).join('');
}

// Auto-detect network changes
let lastSubnet = null;
async function networkPoll() {
  const info = await getNetworkInfo();
  if (info.subnet !== lastSubnet && info.subnet !== 'unknown') {
    if (lastSubnet !== null) {
      log(`NETWORK CHANGED: ${lastSubnet} → ${info.subnet}`);
      propagate();
    }
    lastSubnet = info.subnet;
    document.getElementById('currentNetwork').textContent = info.subnet;
    document.getElementById('currentIP').textContent = info.ip;
  }
}

// Start
loadState();
checkNetwork();
setInterval(networkPoll, 15000); // check every 15s
log('G3 Guardian Beacon initialized');
log('Monitoring network changes...');
</script>
</body>
</html>
