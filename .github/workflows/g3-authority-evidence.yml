name: G3 authority record research negative controls
on:
  pull_request:
    paths:
      - 'evidence/execution-boundary/g3_authority_evidence/**'
      - '.github/workflows/g3-authority-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority-evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ed25519 verifier
        run: python -m pip install 'cryptography==46.0.4'
      - name: Reject forged, stale, revoked, or mismatched records
        run: |
          cd evidence/execution-boundary/g3_authority_evidence
          python3 -B -m unittest -v test_authority_evidence.py
