name: G3 combined veto and OS capability boundary (research)
on:
  pull_request:
    paths:
      - 'evidence/execution-boundary/g3_prod_01/**'
      - 'evidence/execution-boundary/g3_rights_veto/**'
      - 'evidence/execution-boundary/g3_rights_composition/**'
      - '.github/workflows/g3-veto-seccomp-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  withdrawal-to-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test signature verifier
        run: python -m pip install 'cryptography==46.0.4'
      - name: Verify trusted withdrawal orders actual signed publication
        run: |
          cd evidence/execution-boundary
          python3 -B -m unittest -v \
            g3_rights_composition.test_effect_time_rights \
            g3_rights_composition.test_three_way
      - name: Verify bounded G3 signed publication/recovery baseline
        run: |
          cd evidence/execution-boundary/g3_prod_01
          python3 -B -m unittest -v \
            test_g3_signed_bridge \
            test_g3_bound_host_server \
            test_g3_signed_publication_faults
  linux-descriptor-acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require disposable x86-64 Linux with kernel seccomp
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          grep -qw Seccomp /proc/self/status
      - name: Reproduce inherited and delegated FD bypass controls and confined receiver denial
        run: |
          cd evidence/execution-boundary/g3_prod_01
          sudo -n python3 -B -m unittest -v \
            test_g3_scm_rights_cut \
            test_g3_seccomp_scm_rights_cut
