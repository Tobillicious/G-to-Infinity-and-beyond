name: G3 same-event signed rights composition (non-authorizing)
on:
  pull_request:
    paths:
      - 'evidence/execution-boundary/g3_rights_composition/**'
      - '.github/workflows/g3-rights-composition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rights-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned signature verifier
        run: python -m pip install 'cryptography==46.0.4'
      - name: Verify negative controls for joined signed and rights records
        run: |
          cd evidence/execution-boundary
          python3 -B -m unittest -v g3_rights_composition.test_same_event
