name: G3 SCM_RIGHTS capability-cut negative control
on:
  pull_request:
    paths:
      - 'evidence/execution-boundary/g3_prod_01/test_g3_scm_rights_cut.py test_g3_no_capability_leak.py test_g3_hardlink_alias_cut.py'
      - '.github/workflows/g3-scm-rights-cut.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  descriptor-transfer-negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated root-provisioned descriptor-transfer regression
        run: |
          cd evidence/execution-boundary/g3_prod_01
          sudo python3 -B -m unittest -v test_g3_scm_rights_cut.py
